<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
	<head>
		<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">			                    <!-- Responsive meta tag -->	
        <title>Milestone Inventory List</title>	
			<!-- jQuery (must load first) -->
		    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

		    <!-- Bootstrap CSS -->
		    <link rel="stylesheet"
		          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

		    <!-- DataTables 1.x CSS (stable) -->
		    <link rel="stylesheet"
		          href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

		    <!-- Feather Icons -->
		    <script src="https://unpkg.com/feather-icons"></script>

		    <!-- Bootstrap JS -->
		    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

		    <!-- DataTables 1.x JS (stable) -->
		    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

		    <!-- Custom CSS -->
		    <link href="/css/custom.css" rel="stylesheet">
	</head>
	<body>
		<div class="xl-12">
			<div class="row">
				<div class="col-12">
                    <div th:replace="~{layouts/common :: header}"></div>			<!-- Header fragment -->	
                </div>
			</div>
            <div class="row">
							
				<div class="col">
					<section layout:fragment="content">									<!-- Content fragment -->
						<p>Contents</p>
					</section>
				</div>
				
			</div>
            
            <div class="row">
				<div class="col"></div>					
				<div class="col-md-8 col-sm-6 g-3 align-items-center">
                   <div th:replace="~{layouts/common :: footer}"></div>				<!-- Footer fragment -->	
                </div>
				<div class="col"></div>  
            </div>
				
		</div>
	</body>
</html>
