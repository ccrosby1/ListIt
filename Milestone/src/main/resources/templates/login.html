<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	  layout:decorate="~{layouts/center_form}">
    <body>	
		<div layout:fragment="content">
			<div class="center-form-container">
		        <h1 th:text="${title}">Login</h1>
		        <div th:if="${logout}" class="alert alert-success">
		            You have been logged out.
		        </div>
					
		        <span th:if="${error}">
		            <p class="form-error" th:text="${error}">errors</p>
		        </span>

		        <form th:action="@{doLogin}" th:object="${loginModel}" method="post">
		            <div class="form-group mt-3">
		                <label for="username" class="form-label">Username</label>
		                <input class="form-control" type="text" id="username" th:field="*{username}" required>
		                <div class="form-error"
		                     th:if="${#fields.hasErrors('username')}"
		                     th:errors="*{username}"></div>
		            </div>

		            <div class="form-group mt-3">
		                <label for="password" class="form-label">Password</label>
		                <input class="form-control" type="password" id="password" th:field="*{password}" required>
		                <div class="form-error"
		                     th:if="${#fields.hasErrors('password')}"
		                     th:errors="*{password}"></div>
		            </div>

		            <div th:if="${#fields.hasErrors('*')}" class="form-error mt-3">
		                <ul style="margin: 0; padding-left: 18px;">
		                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
		                </ul>
		            </div>

		            <div class="text-center mt-4">
		                <button type="submit" class="btn btn-success">Login</button>
		            </div>

		        </form>
		        <p class="mt-3">Don't have an account? <a href="/registration/">Register here!</a></p>
		        <p>Forgot your password? <a href="">Reset here!</a></p>
		    </div>
		</div>
	</body>
</html>
